# Мета-домен: скиллы про саму коллекцию — что в ней есть, здорова ли установка,
# как добавить новый скилл, какие скиллы реально работают.
# Опирается на CLI bear-skills, но не требует его как бинарь: CLI вызывается
# через node из каталога репозитория, который скилл находит сам.

name: bear
description: Мета — справка по коллекции, диагностика установки, создание скилла, статистика срабатываний.

requires_env: []

targets:
  rules:  ${CLAUDE_HOME}/rules
  skills: ${CLAUDE_HOME}/skills
  agents: ${CLAUDE_HOME}/agents

# Транзитивные зависимости; source paths преобразуют provider-адаптеры.
dependencies:
  skill:bear-new-skill:
    - rule:agentops-auto-clarity
  command:bear:
    - skill:bear-help
  command:bear-doctor:
    - skill:bear-doctor
  command:bear-stats:
    - skill:bear-stats

# Работа над задачей до и вокруг кода: допрос плана, состязательное ревью,
# построчные комментарии к diff, достройка экспириенс-слоя.
# Не требует ничего от окружения.

name: code
description: Код и планы — допрос плана до реализации, состязательное ревью, построчные комментарии, последние 20%.

requires_env: []

targets:
  rules:  ${CLAUDE_HOME}/rules
  skills: ${CLAUDE_HOME}/skills
  agents: ${CLAUDE_HOME}/agents

# Транзитивные зависимости; source paths преобразуют provider-адаптеры.
dependencies:
  skill:code-review-line:
    - rule:agentops-auto-clarity

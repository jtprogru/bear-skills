# Obsidian PKB domain — правила, скиллы и агенты для работы с
# персональной базой знаний по методологии PARA.
#
# Этот домен требует переменную окружения BEAR_VAULT, указывающую
# на корень Obsidian-хранилища. Без неё домен не разворачивается.
#
# rules уезжают в $BEAR_VAULT/.agents/rules/ — vault-local, потому что
# скиллы ссылаются на них как `.agents/rules/<file>.md` (путь относительно vault).
# skills и agents — в ~/.claude/{skills,agents}/ по конвенции Claude Code.

name: obsidian
description: PKB на Obsidian по PARA — ингест, разбор inbox, untangle hub, ежедневник.

requires_env:
  - BEAR_VAULT

targets:
  rules:  ${BEAR_VAULT}/.agents/rules
  skills: ${CLAUDE_HOME}/skills
  agents: ${CLAUDE_HOME}/agents

# Транзитивные зависимости; source paths преобразуют provider-адаптеры.

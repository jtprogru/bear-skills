# SRE / Kubernetes домен — скиллы для incident-management, runbooks, диагностики.
# Не требует env-переменных. Rules/skills/agents едут в ~/.claude/ глобально.
#
# Скиллы srekit-* работают поверх CLI `srekit` (скаффолдит артефакты по шаблонам).
# Без бинаря в PATH они бесполезны, поэтому объявлены через requires_bin точечно —
# домен ставится, скипаются только они.
# Установка CLI: brew install jtprogru/tap/srekit
#            или go install github.com/jtprogru/srekit@latest

name: sre
description: SRE — постмортемы и runbook'и через srekit, Kubernetes triage.

requires_env: []

requires_bin:
  srekit:
    - skill:srekit
    - skill:srekit-postmortem
    - skill:srekit-runbook

targets:
  rules:  ${CLAUDE_HOME}/rules
  skills: ${CLAUDE_HOME}/skills
  agents: ${CLAUDE_HOME}/agents

# Транзитивные зависимости; source paths преобразуют provider-адаптеры.
dependencies:
  agent:sre-oncall-engineer:
    - rule:sre-incident-severity
    - rule:sre-runbook-template
    - skill:sre-k8s-triage
    - skill:srekit
    - skill:srekit-postmortem
    - skill:srekit-runbook
  skill:srekit-postmortem:
    - rule:sre-incident-severity
    - rule:sre-runbook-template
  skill:srekit:
    - rule:sre-incident-severity
    - rule:sre-runbook-template
  skill:srekit-runbook:
    - rule:sre-incident-severity
    - rule:sre-runbook-template
  skill:sre-k8s-triage:
    - rule:sre-incident-severity
    - rule:sre-runbook-template

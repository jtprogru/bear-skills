# Telegram домен — скиллы поверх MCP-сервера telegram-mcp (личный аккаунт по MTProto).
# Не требует env: секреты сервер берёт из Keychain сам. Глобально в ~/.claude/.
#
# Без подключённого MCP-сервера `telegram` скиллы домена бесполезны, но проверить
# это на установке нельзя: сервер — не бинарь в PATH, а запись в конфиге Claude Code.
# requires_mcp фиксирует нужные инструменты; проверка сессии остаётся первым шагом скилла.
# Сервер: https://github.com/jtprogru/telegram-mcp

name: telegram
description: Telegram — сводки чатов личного аккаунта через telegram-mcp.

requires_env: []

targets:
  rules:  ${CLAUDE_HOME}/rules
  skills: ${CLAUDE_HOME}/skills
  agents: ${CLAUDE_HOME}/agents

# Транзитивные зависимости; source paths преобразуют provider-адаптеры.
dependencies:
  skill:telegram-chat-digest:
    - rule:agentops-auto-clarity

requires_mcp:
  telegram:tg_me:
    - skill:telegram-chat-digest
  telegram:tg_dialogs:
    - skill:telegram-chat-digest
  telegram:tg_history:
    - skill:telegram-chat-digest
  telegram:tg_message:
    - skill:telegram-chat-digest
  telegram:tg_search:
    - skill:telegram-chat-digest
